<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuizTrack - Professional Certificate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { 
      background-color: #00008B;
      background-image: url('https://wallpaper-house.com/data/out/10/wallpaper2you_418311.jpg'); 
      background-size: cover; 
      color: #f8fafc; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
    .card-custom { 
      background-color: blue; 
      background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmP_p94o6dYyhvw9hYqYof0TtMo7Q9lozstuw5VUYG5ljOiRB5AYXNYJQI&s=10'); 
      background-size: cover;
      border: 1px solid #1f2937; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .form-control, .form-select { 
      background-color: #030712; 
      border: 1px solid #374151; 
      color: #f8fafc; 
      border-radius: 8px;
      padding: 10px 14px;
    }
    .form-control:focus, .form-select:focus { 
      background-color: #030712; 
      border-color: #38bdf8; 
      color: #f8fafc; 
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); 
    }
    .printable-box {
      background: linear-gradient(135deg, #fdfbf7 0%, #f4eee1 100%);
      color: #1e293b;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 10px solid #d4af37;
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100%;
      max-width: 100%;
    }
    .printable-box::before {
      content: "";
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 2px dashed #b89728;
      pointer-events: none;
      border-radius: 10px;
    }
    .cert-title {
      font-family: 'Playfair Display', serif;
      letter-spacing: 2px;
      color: #111827;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }
    .cert-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 2.5rem);
      color: #0f172a;
      border-bottom: 2px solid #d4af37;
      display: inline-block;
      padding-bottom: 5px;
      word-break: break-word;
      max-width: 100%;
    }
    #outType {
      white-space: normal !important;
      word-break: break-word;
      max-width: 100%;
      display: inline-block;
      line-height: 1.4;
    }
    @media print {
      body * { visibility: hidden; }
      .printable-box, .printable-box * { visibility: visible; }
      .printable-box { position: absolute; left: 0; top: 0; width: 100%; border: 8px solid #d4af37 !important; box-shadow: none; }
    }
  </style>
</head>
<body onload="updateCert()">
  <div class="container py-4 px-2 px-md-3">
    <div class="d-flex justify-content-between align-items-center mb-4 d-print-none">
      <a href="Main.html" class="btn btn-success btn-sm"><i class="bi bi-arrow-left me-1"></i> <b>Back to Dashboard</b></a>
      <button class="btn btn-warning fw-bold text-dark px-3 py-2 shadow btn-sm" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
    </div>
    <div class="row g-4 align-items-start">
      <div class="col-lg-4 d-print-none">
        <div class="card card-custom p-3 p-md-4">
          <div class="d-flex align-items-center mb-3 pb-2 border-bottom border-secondary">
            <i class="bi bi-sliders text-warning fs-4 me-2"></i>
            <h5 class="fw-bold text-white mb-0">Certificate Customizer</h5>
          </div>
          <div class="mb-3">
            <label class="form-label small text-warning fw-semibold">Enterprise Name</label>
            <input type="text" class="form-control" id="certHolder" placeholder="Enter Business Name" oninput="updateCert()">
          </div>
          <div class="mb-3">
            <label class="form-label small text-warning fw-semibold">Award Category</label>
            <select class="form-select" id="certType" onchange="updateCert()">
              <option value="" selected disabled>Select Award Category</option>
              <option value="Excellence in Financial Management & Compliance">Excellence in Financial Management & Compliance</option>
              <option value="Outstanding Business Growth & Revenue Award">Outstanding Business Growth Award</option>
              <option value="Transparent Bookkeeping & Asset Management">Transparent Bookkeeping & Asset Management</option>
            </select>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="printable-box p-3 p-md-5 text-center">
          <div class="mb-2 text-warning">
            <h1>🏅</h1>
          </div>
          <h1 class="cert-title fw-bold text-dark mb-2">Certificate of Appreciation</h1>
          <p class="text-muted fst-italic mb-4 medium px-2">This proud document is presented with honor for maintaining impeccable financial records and statutory compliance.</p>
          
          <div class="my-3 py-2">
            <span class="text-muted medium text-uppercase d-block mb-1" style="letter-spacing: 2px;">Proudly Presented To</span>
            <h2 class="cert-name fw-bold my-2" id="outHolder"></h2>
            <div class="px-2">
              <span class="badge bg-dark text-warning fs-6 px-3 py-2 mt-3 shadow-sm border border-warning" id="outType" style="letter-spacing: 0.5px;"></span>
            </div>
          </div>

          <div class="row text-start mt-4 pt-4 align-items-end g-2">
            <div class="col-6">
              <div class="d-inline-block" style="min-width: 120px;">
                <span class="fw-bold text-dark d-block medium" id="certDate"></span>
                <small class="text-muted" style="font-size: 0.75rem;">Date of Issuance</small>
              </div>
            </div>
            <div class="col-6 text-end">
              <div class="d-inline-block text-end" style="min-width: 120px;">
                <span class="fw-bold text-dark font-monospace d-block medium">By</span>
                <span class="fw-bold text-dark font-monospace d-block medium">BuizTrack</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function updateCert() {
      let holder = document.getElementById('certHolder').value;
      let type = document.getElementById('certType').value;
      document.getElementById('outHolder').innerText = holder ? holder : 'Enter Enterprise Name';
      document.getElementById('outType').innerText = type ? type : 'Award Category';
    }
    document.getElementById('certDate').innerText = new Date().toLocaleDateString('en-IN');
  </script>
</body>
</html>
