<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuizTrack - GST & Tax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {  background-color: #9400D3;
background-image: url('https://images.pexels.com/photos/6985265/pexels-photo-6985265.jpeg?cs=srgb&dl=pexels-gradienta-6985265.jpg&fm=jpg'); 
      background-size: cover; color: #f8fafc; font-family: system-ui, sans-serif; }
    .card-custom { 
    background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqUrjTMxhfUVP1keDliCK2DBp3wIWAeLCqdsTBszrUkjP8_PdxRZmyTpZ_&s=10'); 
    background-size: cover; border: 1px solid #1f2937; border-radius: 12px; 
    }
    .form-control { background-color: #030712; border: 1px solid #374151; color: #f8fafc; 
     }
    .form-control:focus { background-color: #030712; border-color: #38bdf8; color: #f8fafc; box-shadow: none;
     }
    .tax-box {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 5px;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }
    .tax-box:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <a href="Main.html" class="btn btn-success btn-sm mb-4"><i class="bi bi-arrow-left me-1"></i> <b>Back to Dashboard</b></a>
    <h1 class="fw-bold text-white mb-3">GST & Tax Profit Calculator</h1>
    
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card card-custom p-4 h-100">
          <div class="mb-3">
            <label class="form-label medium text-warning fw-bold">Base Amount</label>
            <input type="number" class="form-control" id="gstBase" placeholder="Enter the Amount" oninput="calcGst()">
          </div>
          <div class="mb-3">
            <label class="form-label medium text-warning fw-bold">Tax / GST Rate (%)</label>
            <input type="number" step="0.1" class="form-control" id="gstSlab" placeholder="Enter Tax Rate"  oninput="calcGst()">
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card card-custom p-4 h-100 d-flex flex-column justify-content-center">
          <div class="mb-2">
            <span class="text-white fw-bold small">Calculated Total Tax:</span>
            <h4 class="text-warning fw-bold mb-0" id="gstOut">₹0</h4>
          </div>
          <hr class="border-secondary my-2">
          
          
          <div class="row text-center mb-3 g-2">
            <div class="col-4">
              <div class="tax-box">
                <span class="text-danger small fw-bold d-block">CGST Amount (50%)</span>
                <h6 class="text-white fw-bold mt-1 mb-0" id="cgstOut">₹0</h6>
              </div>
            </div>
            <div class="col-4">
              <div class="tax-box">
                <span class="text-warning small fw-bold d-block">SGST Amount (50%)</span>
                <h6 class="text-white fw-bold mt-1 mb-0" id="sgstOut"></h6>
              </div>
            </div>
            <div class="col-4">
              <div class="tax-box">
                <span class="text-info small fw-bold d-block">IGST Amount (100%)</span>
                <h6 class="text-white fw-bold mt-1 mb-0" id="igstOut">₹0</h6>
              </div>
            </div>
          </div>
          
          <hr class="border-secondary my-1">
          <div class="mt-2">
            <span class="text-white fw-bold small">Total Amount (Base + Tax):</span>
            <h3 class="text-info fw-bold mb-0" id="totalOut">₹0</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calcGst() {
      let base = parseFloat(document.getElementById('gstBase').value) || 0;
      let slab = parseFloat(document.getElementById('gstSlab').value) || 0;
      
      let gst = (base * slab) / 100;
      let halfGst = gst / 2;
      let total = base + gst;
      
      document.getElementById('gstOut').innerText =  gst.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      document.getElementById('cgstOut').innerText =  halfGst.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      document.getElementById('sgstOut').innerText =  halfGst.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      document.getElementById('igstOut').innerText =  gst.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      document.getElementById('totalOut').innerText =  total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
    calcGst();
  </script>
</body>
</html>
