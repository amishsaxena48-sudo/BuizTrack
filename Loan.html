<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuizTrack - Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #4B0082;
      background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSskUPvclJ1ICRCy7eZC7o-l_hm6v9FYiIOlxxfIzOmeA-zJl7o1TXupuw&s=10'); 
      background-size: cover; 
      color: #f8fafc; 
      font-family: system-ui, sans-serif; 
    }
    .card-custom { 
      background-image: url('https://static.vecteezy.com/system/resources/thumbnails/015/278/060/small/trendy-soft-retro-gradient-background-design-minimalistic-soft-gradient-in-pastel-colors-elegant-soft-blur-texture-colorful-mesh-gradient-background-vector.jpg'); 
      background-size: cover; 
      border: 1px solid #1f2937; 
      border-radius: 12px; 
    }
    .form-control, .form-select { background-color: #030712; border: 1px solid #374151; color: #f8fafc; }
    .form-control:focus, .form-select:focus { background-color: #030712; border-color: #38bdf8; color: #f8fafc; box-shadow: none; }
    

    .calc-box {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }
    .calc-box:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <a href="Main.html" class="btn btn-success btn-sm mb-4"><i class="bi bi-arrow-left me-1"></i> <b>Back to Dashboard</b></a>
    <h1 class="fw-bold text-white mb-3">Business Loan EMI Calculator</h1>
    
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card card-custom p-4 h-100">
          <div class="mb-3">
            <label class="form-label medium text-danger fw-bold">Loan Amount</label>
            <input type="number" class="form-control" id="loanAmt" placeholder="Enter the Amount" oninput="calcEmi()">
          </div>
          <div class="mb-3">
            <label class="form-label medium text-danger fw-bold">Interest Rate (% p.a.)</label>
            <input type="number" step="0.1" class="form-control" id="loanRate" placeholder="Enter the Intrest Rate" oninput="calcEmi()">
          </div>
          <div class="row mb-3">
            <div class="col-7">
              <label class="form-label medium text-danger fw-bold">Tenure Value</label>
              <input type="number" class="form-control" id="loanTenure" value="12" oninput="calcEmi()">
            </div>
            <div class="col-5">
              <label class="form-label medium text-danger fw-bold">Tenure Type</label>
              <select class="form-select" id="tenureType" onchange="calcEmi()">
                <option value="months" selected>Months</option>
                <option value="years">Years</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card card-custom p-4 h-100 d-flex flex-column justify-content-center">
          <div class="mb-2">
            <span class="text-dark fw-bold medium">Estimated Monthly EMI:</span>
            <h3 class="text-success fw-bold mb-0 display-6" id="emiOut"></h3>
          </div>
          
          <hr class="border-secondary my-3">
          

          <div class="row text-center g-2 mb-2">
            <div class="col-6">
              <div class="calc-box">
                <span class="text-info small fw-bold d-block">Principal Amount</span>
                <h6 class="text-white fw-bold mt-1 mb-0" id="principalOut">₹0</h6>
              </div>
            </div>
            <div class="col-6">
              <div class="calc-box">
                <span class="text-warning small fw-bold d-block">Total Interest Payable</span>
                <h6 class="text-white fw-bold mt-1 mb-0" id="interestOut">₹0</h6>
              </div>
            </div>
          </div>
          
          <hr class="border-secondary my-2">
          
          <div class="mt-2">
            <span class="text-dark fw-bold medium">Total Amount Payable (Principal + Interest):</span>
            <h3 class="text-info fw-bold mb-0" id="totalOut">₹0</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calcEmi() {
      let p = parseFloat(document.getElementById('loanAmt').value) || 0;
      let annualRate = parseFloat(document.getElementById('loanRate').value) || 0;
      let tenureVal = parseFloat(document.getElementById('loanTenure').value) || 0;
      let tenureType = document.getElementById('tenureType').value;
      
      let n = tenureType === 'years' ? tenureVal * 12 : tenureVal;
      if (n <= 0 || p <= 0) {
        document.getElementById('emiOut').innerText = '0';
        document.getElementById('principalOut').innerText = '0';
        document.getElementById('interestOut').innerText = '0';
        document.getElementById('totalOut').innerText = '0';
        return;
      }

      let r = annualRate / 12 / 100;
      let emi = 0;
      if (r === 0) {
        emi = p / n;
      } else {
        emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      }

      let totalPayment = emi * n;
      let totalInterest = totalPayment - p;

      document.getElementById('emiOut').innerText =  Math.round(emi).toLocaleString('en-IN');
      document.getElementById('principalOut').innerText =  Math.round(p).toLocaleString('en-IN');
      document.getElementById('interestOut').innerText = Math.round(totalInterest).toLocaleString('en-IN');
      document.getElementById('totalOut').innerText = Math.round(totalPayment).toLocaleString('en-IN');
    }
    calcEmi();
  </script>
</body>
</html>
